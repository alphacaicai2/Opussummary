services:
  opusbrief:
    build: .
    container_name: opusbrief
    restart: unless-stopped
    ports:
      - "127.0.0.1:8812:8812"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
    environment:
      - TZ=Asia/Shanghai
      - WEB_PORT=8812
    networks:
      - default
      - relay
networks:
  relay:
    external: true
    name: opus_default
